<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<pattern id="z" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="12" fill="#ff5448"/></pattern></defs>
<rect width="1100" height="370" fill="#111"/>
<text x="40" y="45" fill="#fff" font-family="sans-serif" font-size="26" font-weight="bold">CinePi Zebra: threshold warning vs clipping</text>
<rect x="55" y="95" width="950" height="95" fill="url(#g)" stroke="#777"/>
<g font-family="sans-serif" font-size="16" fill="#ddd">
<text x="50" y="220">0 IRE</text><text x="694" y="220">70</text><text x="789" y="220">80</text><text x="837" y="220">85</text><text x="885" y="220">90</text><text x="932" y="220">95</text><text x="982" y="220">100</text>
</g>
<g stroke="#e2b84f" stroke-width="3">
<line x1="720" y1="85" x2="720" y2="200"/><line x1="815" y1="85" x2="815" y2="200"/><line x1="862" y1="85" x2="862" y2="200"/><line x1="910" y1="85" x2="910" y2="200"/><line x1="957" y1="85" x2="957" y2="200"/>
</g>
<rect x="910" y="95" width="95" height="95" fill="url(#z)" opacity=".72"/>
<rect x="980" y="95" width="25" height="95" fill="#ff3030" opacity=".86"/>
<g font-family="sans-serif" fill="#eee">
<text x="55" y="275" font-size="18">90 IRE default: practical bright-highlight warning. Stripes do not necessarily mean irreversible clipping.</text>
<text x="55" y="307" font-size="18">95–100 IRE: use when protecting specular whites / checking the top end.</text>
<text x="55" y="339" font-size="18">Solid red: an 8-bit preview RGB channel is at or above 250/255 → near-clipping warning.</text>
</g>
</svg>
